version: '3.8'

networks:
  airline-network:
    external: true
    name: airline-management-system-network

volumes:
  sqlserver-data:

services:
  # Note: SQL Server is now managed in the /sqlserver-docker/ directory

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - airline-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - airline-network

  identity-service:
    build:
      context: ./AirlineManagementSystem
      dockerfile: Services/IdentityService/Dockerfile
    container_name: identity-service
    restart: always
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=airline-sqlserver;Database=Airline_IdentityDB;User Id=${SQL_USER};Password=${SQL_PASSWORD};TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__Key=${JWT_SECRET}
      - RabbitMqSettings__HostName=rabbitmq
    ports:
      - "5001:5001"
    depends_on:
      - redis
      - rabbitmq
    networks:
      - airline-network

  flight-service:
    build:
      context: ./AirlineManagementSystem
      dockerfile: Services/FlightService/Dockerfile
    container_name: flight-service
    restart: always
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=airline-sqlserver;Database=Airline_FlightDB;User Id=${SQL_USER};Password=${SQL_PASSWORD};TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__Key=${JWT_SECRET}
      - RabbitMqSettings__HostName=rabbitmq
    ports:
      - "5002:5002"
    depends_on:
      - redis
      - rabbitmq
    networks:
      - airline-network

  booking-service:
    build:
      context: ./AirlineManagementSystem
      dockerfile: Services/BookingService/Dockerfile
    container_name: booking-service
    restart: always
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=airline-sqlserver;Database=Airline_BookingDB;User Id=${SQL_USER};Password=${SQL_PASSWORD};TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__Key=${JWT_SECRET}
      - RabbitMqSettings__HostName=rabbitmq
    ports:
      - "5003:5003"
    depends_on:
      - redis
      - rabbitmq
    networks:
      - airline-network

  payment-service:
    build:
      context: ./AirlineManagementSystem
      dockerfile: Services/PaymentService/Dockerfile
    container_name: payment-service
    restart: always
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=airline-sqlserver;Database=Airline_PaymentDB;User Id=${SQL_USER};Password=${SQL_PASSWORD};TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__Key=${JWT_SECRET}
      - RabbitMqSettings__HostName=rabbitmq
      - Razorpay__KeyId=${RAZORPAY_KEY_ID}
      - Razorpay__KeySecret=${RAZORPAY_KEY_SECRET}
    ports:
      - "5004:5004"
    depends_on:
      - redis
      - rabbitmq
    networks:
      - airline-network

  checkin-service:
    build:
      context: ./AirlineManagementSystem
      dockerfile: Services/CheckInService/Dockerfile
    container_name: checkin-service
    restart: always
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=airline-sqlserver;Database=Airline_CheckInDB;User Id=${SQL_USER};Password=${SQL_PASSWORD};TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__Key=${JWT_SECRET}
      - RabbitMqSettings__HostName=rabbitmq
    ports:
      - "5005:5005"
    depends_on:
      - redis
      - rabbitmq
    networks:
      - airline-network

  baggage-service:
    build:
      context: ./AirlineManagementSystem
      dockerfile: Services/BaggageService/Dockerfile
    container_name: baggage-service
    restart: always
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=airline-sqlserver;Database=Airline_BaggageDB;User Id=${SQL_USER};Password=${SQL_PASSWORD};TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__Key=${JWT_SECRET}
      - RabbitMqSettings__HostName=rabbitmq
    ports:
      - "5006:5006"
    depends_on:
      - redis
      - rabbitmq
    networks:
      - airline-network

  reward-service:
    build:
      context: ./AirlineManagementSystem
      dockerfile: Services/RewardService/Dockerfile
    container_name: reward-service
    restart: always
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=airline-sqlserver;Database=Airline_RewardDB;User Id=${SQL_USER};Password=${SQL_PASSWORD};TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__Key=${JWT_SECRET}
      - RabbitMqSettings__HostName=rabbitmq
    ports:
      - "5007:5007"
    depends_on:
      - redis
      - rabbitmq
    networks:
      - airline-network

  agent-service:
    build:
      context: ./AirlineManagementSystem
      dockerfile: Services/AgentService/Dockerfile
    container_name: agent-service
    restart: always
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=airline-sqlserver;Database=Airline_AgentDB;User Id=${SQL_USER};Password=${SQL_PASSWORD};TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__Key=${JWT_SECRET}
      - RabbitMqSettings__HostName=rabbitmq
    ports:
      - "5008:5008"
    depends_on:
      - redis
      - rabbitmq
    networks:
      - airline-network

  notification-service:
    build:
      context: ./AirlineManagementSystem
      dockerfile: Services/NotificationService/Dockerfile
    container_name: notification-service
    restart: always
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=airline-sqlserver;Database=Airline_NotificationDB;User Id=${SQL_USER};Password=${SQL_PASSWORD};TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__Key=${JWT_SECRET}
      - RabbitMqSettings__HostName=rabbitmq
      - EmailSettings__SmtpServer=${SMTP_SERVER}
      - EmailSettings__SmtpPort=${SMTP_PORT}
      - EmailSettings__SenderEmail=${SENDER_EMAIL}
      - EmailSettings__Password=${SENDER_PASSWORD}
    ports:
      - "5009:5009"
    depends_on:
      - redis
      - rabbitmq
    networks:
      - airline-network

  admin-service:
    build:
      context: ./AirlineManagementSystem
      dockerfile: Services/AdminService/Dockerfile
    container_name: admin-service
    restart: always
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=airline-sqlserver;Database=Airline_AdminDB;User Id=${SQL_USER};Password=${SQL_PASSWORD};TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__Key=${JWT_SECRET}
      - RabbitMqSettings__HostName=rabbitmq
    ports:
      - "5010:5010"
    depends_on:
      - redis
      - rabbitmq
    networks:
      - airline-network

  api-gateway:
    build:
      context: ./AirlineManagementSystem
      dockerfile: ApiGateway/Dockerfile
    container_name: api-gateway
    restart: always
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - JwtSettings__Key=${JWT_SECRET}
    ports:
      - "5000:5000"
    depends_on:
      - identity-service
      - flight-service
      - booking-service
      - payment-service
      - checkin-service
      - baggage-service
      - reward-service
      - agent-service
      - notification-service
      - admin-service
    networks:
      - airline-network

  frontend:
    build:
      context: ./AirlineManagementSystem_Frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "4200:4200"
    depends_on:
      - api-gateway
    networks:
      - airline-network
